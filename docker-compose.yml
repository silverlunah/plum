services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plum
      POSTGRES_USER: plum
      POSTGRES_PASSWORD: plum
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plum']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    environment:
      DATABASE_URL: 'postgresql://plum:plum@postgres:5432/plum'
      # Compose does not pass host env through, so an origin pin set by the
      # operator would otherwise never reach the container.
      PLUM_ALLOWED_ORIGINS: '${PLUM_ALLOWED_ORIGINS:-}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/tests:/app/tests:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        # Optional: bakes the API URL in as the image's default. Left unset, the
        # frontend entrypoint applies VITE_API_URL from the environment on every
        # start (docker-compose.override.yml supplies it), so the API URL can
        # change without rebuilding.
        VITE_API_URL: '${VITE_API_URL:-}'
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3002}:3002'
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
